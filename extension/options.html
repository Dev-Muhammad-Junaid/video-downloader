<!DOCTYPE html>
<html>
<head>
    <title>SnapDown Extension Options</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --container-bg: #141415;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent: #ff4500;
            --accent-hover: #ff571a;
            --border: #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #1a1a1a;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        #status {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <img src="icons/icon128.png" alt="SnapDown">
            SnapDown Configuration
        </h1>
        <p>Set the origin URL where your SnapDown server is hosted. This allows the extension to automatically queue links in the background without opening new tabs.</p>
        
        <div class="form-group">
            <label for="serverUrl">SnapDown Server URL</label>
            <input type="url" id="serverUrl" placeholder="http://localhost:3000" required>
        </div>

        <button id="saveBtn">Save Configuration</button>
        <div id="status"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
