<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    SnapDown app icon.

    Built to the macOS icon conventions the rest of the app now follows: a
    squircle canvas, a top-lit vertical gradient, a hairline rim for edge
    definition against both light and dark Docks, and a single high-contrast
    glyph that survives being drawn at 16px.

    The palette is the app's own systemBlue accent rather than the previous
    purple/magenta, which no longer belonged next to the new UI.

    The glyph is one shape doing two jobs: a downward triangle reads as "play"
    (media) and as "download" (direction) at the same time, and the bar under
    it completes the download-to-tray reading.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5AB1FF"/>
      <stop offset="48%"  stop-color="#1E82FF"/>
      <stop offset="100%" stop-color="#0A56D6"/>
    </linearGradient>

    <!-- Top-down sheen: macOS icons are lit from above. -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grounding shade in the lower corners so the tile doesn't read flat. -->
    <radialGradient id="ground" cx="50%" cy="104%" r="66%">
      <stop offset="0%"   stop-color="#03286E" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#03286E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000018" stop-opacity="0.20"/>
    </linearGradient>

    <filter id="glyph-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#052F7A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#ground)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <g filter="url(#glyph-lift)">
    <!-- Stem + head drawn as one rounded arrow. Generous stroke joins keep the
         corners soft at large sizes without turning to mush at 16px. -->
    <rect x="466" y="252" width="92" height="248" rx="46" fill="#FFFFFF"/>
    <path
      d="M 344 430 L 680 430 L 512 664 Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="76"
      stroke-linejoin="round"
    />
    <!-- Tray: the surface the arrow lands on. -->
    <rect x="330" y="732" width="364" height="82" rx="41" fill="#FFFFFF"/>
  </g>

  <!-- Rim last so it sits above the fills. -->
  <rect x="1" y="1" width="1022" height="1022" rx="227" ry="227"
        fill="none" stroke="url(#rim)" stroke-width="2.5"/>
</svg>
